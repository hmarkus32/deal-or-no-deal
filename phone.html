<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121018">
  <title>Host phone · Deal or No Deal</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="game.css?v=3">
  <script defer src="game-logic.js?v=3"></script>
  <script defer src="link.js?v=3"></script>
  <script defer src="phone.js?v=3"></script>
</head>
<body class="host-phone">
  <header class="phone-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="phone-title">Deal or No Deal</span></div>
    <span id="phone-status" class="status-pill" role="status">Offline</span>
  </header>
  <main class="phone-main">
    <form id="join-room">
      <h1>Link to the stage</h1>
      <label>Room code<input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" required></label>
      <p id="join-error" role="status"></p>
      <button class="gold">Join</button>
    </form>
    <section id="remote" hidden>
      <div id="phone-round" class="eyebrow"></div>
      <h1 id="phone-heading"></h1>
      <div id="phone-controls"></div>
    </section>
  </main>
</body>
</html>
