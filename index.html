<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121018">
  <title>Deal or No Deal</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="game.css">
  <script defer src="game-logic.js"></script>
  <script defer src="host.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="brand-name">Game Night</span></div>
    <div class="tools">
      <button id="sound" class="tool"><span class="sound-icon" aria-hidden="true">♪</span><span id="sound-label">Sound on</span></button>
      <button id="menu" class="tool" aria-label="Game menu" aria-haspopup="dialog"><span class="menu-icon" aria-hidden="true">•••</span></button>
    </div>
  </header>
  <main>
    <section id="title-screen" class="screen">
      <div class="hero">
        <img class="stage-art" src="assets/briefcase-stage.webp" alt="" fetchpriority="high">
        <div class="hero-copy">
          <div class="board-tag"><i></i><span id="board-name"></span></div>
          <h1 id="game-title"></h1>
          <p class="intro">Pick a case. Hear the offer.<br>Take the deal or trust your luck.</p>
          <div class="actions"><button class="gold" id="start">Start Game <span aria-hidden="true">→</span></button><button id="setup"><span aria-hidden="true">⚙︎</span> Setup</button></div>
        </div>
      </div>
      <div class="stats">
        <div><span class="stat-symbol" aria-hidden="true">▦</span><div><strong>26</strong><small>Briefcases</small></div></div>
        <div><span class="stat-symbol" aria-hidden="true">☎︎</span><div><strong>9</strong><small>Banker offers</small></div></div>
        <div><span class="stat-symbol" aria-hidden="true">♢</span><div><strong id="top-prize"></strong><small>Top prize</small></div></div>
      </div>
    </section>
    <section id="game-screen" class="screen" hidden>
      <aside class="money-panel" aria-label="Money board">
        <div class="panel-heading"><h2>Money board</h2><span id="in-play"></span></div>
        <div id="money-board"></div>
      </aside>
      <section class="play-panel" aria-labelledby="play-heading">
        <div class="play-heading">
          <div><div class="eyebrow" id="round-label"></div><h2 tabindex="-1" id="play-heading"></h2></div>
          <div id="held" hidden><small>Your case</small><strong></strong></div>
        </div>
        <div id="play-area"></div>
      </section>
    </section>
    <section id="setup-screen" class="screen" hidden>
      <div class="setup-heading"><h2 tabindex="-1">Game setup</h2><button id="cancel-setup">Cancel</button></div>
      <form id="settings-form" novalidate>
        <div class="setup-controls">
          <label>Game title<input id="title-input" required maxlength="60" autocomplete="off"></label>
          <label>Board preset<select id="preset-list"></select></label>
          <div class="preset-actions"><button type="button" id="load-preset">Load preset</button><button type="button" id="delete-preset">Delete</button></div>
        </div>
        <fieldset><legend>Case amounts</legend><div id="amount-fields"></div></fieldset>
        <div id="setup-message" role="status"></div>
        <div class="setup-bottom"><button type="button" id="reset-defaults">Reset defaults</button><button type="button" id="save-preset">Save as preset</button><button type="submit" class="gold" id="save-settings">Save setup</button></div>
      </form>
    </section>
  </main>
  <dialog id="host-dialog" aria-labelledby="dialog-heading">
    <form method="dialog">
      <h2 id="dialog-heading"></h2><p id="dialog-copy" hidden></p>
      <label id="name-label" hidden>Preset name<input id="preset-name" maxlength="60" autocomplete="off"></label>
      <p id="name-error" role="status" hidden></p>
      <div id="dialog-actions" class="actions"></div>
    </form>
  </dialog>
  <div id="confetti" aria-hidden="true"></div>
</body>
</html>
